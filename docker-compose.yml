services:
  mysql:
    image: mysql:8.4
    container_name: recruit_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 12345678
      MYSQL_DATABASE: recruit
      MYSQL_USER: recruit
      MYSQL_PASSWORD: recruit
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p12345678"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  embedding-api:
    build:
      context: ./embedding-service
      dockerfile: Dockerfile
    container_name: recruit_embedding_api
    restart: unless-stopped
    environment:
      - EMBEDDING_MODEL=sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      - MAX_TEXT_CHARS=10000
    ports:
      - "8001:8001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5).read()\"",
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  qdrant:
    image: qdrant/qdrant:v1.15.4
    container_name: recruit_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:6333/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: recruit_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

  backend:
    build:
      context: ./recruit
      dockerfile: Dockerfile
    container_name: recruit_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      embedding-api:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/recruit?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      DB_USERNAME: root
      DB_PASSWORD: 12345678
      APP_PUBLIC_BASE_URL: http://localhost:8080
      APP_FRONTEND_BASE_URL: http://localhost:3000
      APP_EMBEDDING_PYTHON_URL: http://embedding-api:8001
      APP_QDRANT_ENABLED: "true"
      APP_QDRANT_URL: http://qdrant:6333
      APP_QDRANT_TIMEOUT_MILLIS: "10000"
      APP_ELASTICSEARCH_ENABLED: "true"
      APP_ELASTICSEARCH_URL: http://elasticsearch:9200
      APP_ELASTICSEARCH_TIMEOUT_MILLIS: "10000"
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:8080/api/v1/public/jobs?gioiHan=1' >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s

  frontend:
    build:
      context: ./recruit_frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
        API_INTERNAL_URL: http://backend:8080/api/v1
    container_name: recruit_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_INTERNAL_URL: http://backend:8080/api/v1
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    ports:
      - "3000:3000"

volumes:
  mysql_data:
  qdrant_data:
  elasticsearch_data:
