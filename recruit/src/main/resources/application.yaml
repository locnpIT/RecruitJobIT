spring:
  application:
    name: recruit

  config:
    # kiến thức mới, thêm cái này vô để đọc được .env springboot
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        format_sql: true


  jackson:
    time-zone: Asia/Ho_Chi_Minh

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  devtools:
    restart:
      # Tránh lỗi ClassNotFound/NoClassDefFoundError do RestartClassLoader giữ class cũ.
      enabled: false

app:
  public:
    base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
    frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:3000}
  jwt:
    secret-base64: ${APP_JWT_SECRET_BASE64:${SECRET_KEY_JWT:}}
    # 604800 giây = 7 ngày. Có thể override bằng APP_JWT_ACCESS_TOKEN_EXPIRATION_SECONDS trong .env.
    access-token-expiration-seconds: ${APP_JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:604800}
  cloudinary:
    cloud-name: ${APP_CLOUDINARY_CLOUD_NAME:}
    api-key: ${APP_CLOUDINARY_API_KEY:}
    api-secret: ${APP_CLOUDINARY_API_SECRET:}
    folder: ${APP_CLOUDINARY_FOLDER:recruit/proofs}
  sepay:
    merchant-id: ${APP_SEPAY_MERCHANT_ID:}
    merchant-secret-key: ${APP_SEPAY_MERCHANT_SECRET_KEY:}
    bank-short-name: ${APP_SEPAY_BANK_SHORT_NAME:}
    bank-account-number: ${APP_SEPAY_BANK_ACCOUNT_NUMBER:}
    payment-code-prefix: ${APP_SEPAY_PAYMENT_CODE_PREFIX:GOI}
    webhook-secret-key: ${APP_SEPAY_WEBHOOK_SECRET_KEY:}
    webhook-url: ${APP_SEPAY_WEBHOOK_URL:}
    qr-image-base-url: ${APP_SEPAY_QR_IMAGE_BASE_URL:https://qr.sepay.vn/img}
    checkout-init-url: ${APP_SEPAY_CHECKOUT_INIT_URL:https://pay-sandbox.sepay.vn/v1/checkout/init}
    checkout-currency: ${APP_SEPAY_CHECKOUT_CURRENCY:VND}
    checkout-operation: ${APP_SEPAY_CHECKOUT_OPERATION:PURCHASE}
    checkout-success-url: ${APP_SEPAY_CHECKOUT_SUCCESS_URL:}
    checkout-error-url: ${APP_SEPAY_CHECKOUT_ERROR_URL:}
    checkout-cancel-url: ${APP_SEPAY_CHECKOUT_CANCEL_URL:}
    checkout-payment-method: ${APP_SEPAY_CHECKOUT_PAYMENT_METHOD:}
  embedding:
    python:
      # URL microservice embedding Python (FastAPI).
      base-url: ${APP_EMBEDDING_PYTHON_URL:http://localhost:8001}
      timeout-millis: ${APP_EMBEDDING_PYTHON_TIMEOUT_MILLIS:15000}
  qdrant:
    enabled: ${APP_QDRANT_ENABLED:false}
    url: ${APP_QDRANT_URL:http://localhost:6333}
    api-key: ${APP_QDRANT_API_KEY:}
    timeout-millis: ${APP_QDRANT_TIMEOUT_MILLIS:5000}
    # MiniLM-L12-v2 cho ra vector 384 chiều.
    # Lưu ý: collection Qdrant cũ 256d phải xóa/tạo lại trước khi sync.
    vector-size: ${APP_QDRANT_VECTOR_SIZE:384}
    kho-ho-so-ung-vien: ${APP_QDRANT_KHO_HO_SO_UNG_VIEN:chi_muc_nhung_ho_so_ung_vien}
    kho-don-ung-tuyen: ${APP_QDRANT_KHO_DON_UNG_TUYEN:chi_muc_nhung_don_ung_tuyen}
    kho-tin-tuyen-dung: ${APP_QDRANT_KHO_TIN_TUYEN_DUNG:chi_muc_nhung_tin_tuyen_dung}
  elasticsearch:
    enabled: ${APP_ELASTICSEARCH_ENABLED:false}
    url: ${APP_ELASTICSEARCH_URL:http://localhost:9200}
    api-key: ${APP_ELASTICSEARCH_API_KEY:}
    username: ${APP_ELASTICSEARCH_USERNAME:}
    password: ${APP_ELASTICSEARCH_PASSWORD:}
    timeout-millis: ${APP_ELASTICSEARCH_TIMEOUT_MILLIS:5000}
    job-index: ${APP_ELASTICSEARCH_JOB_INDEX:public_job_search}
  gemini:
    enabled: ${APP_GEMINI_ENABLED:false}
    api-key: ${APP_GEMINI_API_KEY:}
    model-name: ${APP_GEMINI_MODEL_NAME:gemini-2.5-flash}
    timeout-millis: ${APP_GEMINI_TIMEOUT_MILLIS:20000}
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    from-email: ${APP_MAIL_FROM_EMAIL:${SPRING_MAIL_USERNAME:}}
    from-name: ${APP_MAIL_FROM_NAME:Recruit}
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
          connectiontimeout: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT:5000}
          timeout: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT:5000}
          writetimeout: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT:5000}

server:
  port: 8080

logging:
  level:
    com.phuocloc.projectfinal: DEBUG
